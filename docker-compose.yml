# Internet -> nginx:80 -> app:8000 (app port NOT exposed to the host).
services:
  app:
    build: .
    image: deepseek-study-app:latest
    restart: unless-stopped
    environment:
      # .env is read by docker compose for interpolation; secrets are
      # injected at runtime and never baked into the image.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-30}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    expose:
      - "8000"
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx Basic Auth password file (must exist before `up`; git-ignored)
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - app
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
