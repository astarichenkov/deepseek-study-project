<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="container">
    <h1>{{ app_name }}</h1>
    <p class="subtitle">
      Responses are generated by the <strong>DeepSeek</strong> cloud LLM API.
      Type a question below and press <em>Send</em> (or <kbd>Ctrl</kbd>+<kbd>Enter</kbd>).
    </p>

    <form id="chat-form" novalidate>
      <label class="visually-hidden" for="message">Your question</label>
      <textarea
        id="message"
        rows="5"
        maxlength="{{ max_message_length }}"
        placeholder="Ask a question, e.g. Explain dependency injection"
        autofocus
      ></textarea>
      <div class="controls">
        <button id="send-button" type="submit">Send</button>
        <span id="loading" class="loading hidden" role="status">Thinking…</span>
      </div>
    </form>

    <section id="result" class="hidden" aria-live="polite">
      <h2>Response</h2>
      <div id="answer"></div>
    </section>

    <p id="error" class="error hidden" role="alert"></p>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
